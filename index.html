<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zen — Music & Code</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Font Awesome untuk Logo -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ---- BACKGROUND VIDEO ---- -->
<video class="bg-video" autoplay loop muted playsinline>
  <!-- Ganti "assets/bg-video.mp4" dengan lokasi dan nama video kamu -->
  <source src="assets/bg.mp4" type="video/mp4">
</video>
<!-- Overlay gelap agar tulisan tetap terbaca -->
<div class="video-overlay"></div>
<!-- -------------------------- -->

<div class="page">
  <div class="avatar-wrap animate-in" style="--i: 0;">

      <img src="assets/profil.png" alt="Foto profil Zen">

  </div>

      <div class="icon"><i class="fa-brands fa-spotify"></i></div>
      <div class="link-text">
        <div class="link-title">Spotify</div>
        <div class="link-sub">Zenn</div>

    <a class="link-card brand-youtube animate-in" href="#" target="_blank" rel="noopener" data-label="YouTube Zen Nightcore" style="--i: 5;">

    <a class="link-card brand-youtube animate-in" href="https://www.youtube.com/@SenpaiNightcore20" target="_blank" rel="noopener" data-label="YouTube Senpai Nightcore" style="--i: 6;">

        <div class="link-title">YouTube</div>
        <div class="link-sub">Senpai Nightcore</div>
      </div>
      <div class="arrow">→</div>

    <a class="link-card brand-github animate-in" href="https://github.com/HundredXIV" target="_blank" rel="noopener" data-label="GitHub" style="--i: 7;">

      <div class="link-text">
        <div class="link-title">GitHub</div>
        <div class="link-sub">HundredXIV</div>

    <a class="link-card brand-ig animate-in" href="https://www.instagram.com/i_am_budhi/" target="_blank" rel="noopener" data-label="Instagram" style="--i: 8;">
      <div class="icon"><i class="fa-brands fa-instagram"></i></div>
      <div class="link-text">
        <div class="link-title">Instagram</div>
        <div class="link-sub">i_am_budhi</div>
      </div>
      <div class="arrow">→</div>
    </a>
